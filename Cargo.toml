[package]
name = "cph_judge"
version = "0.1.0"
edition = "2024"
# std::io::pipe (interactive problems) needs 1.87; let-chains in edition 2024 need 1.88.
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
toml = "0.8"
colored = "2.1" # Add this for colors
tokio = { version = "1.51.0", features = ["full"] }
wait4 = "0.1.3"
